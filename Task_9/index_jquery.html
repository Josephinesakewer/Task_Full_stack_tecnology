<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Пример</title>
	<script src="jquery-4.0.0.min.js"></script>
	<!--link rel="stylesheet" href="style.css"-->
	<style>
		body{font-family:Arial,sans-serif;margin:16px}
		table{border-collapse:collapse;margin:12px 0}
		th,td{border:1px solid #999;padding:3px 8px;text-align:center;font-size:13px}
		th{background:#ddebf7}
		button{margin:2px 4px 2px 0;padding:5px 10px}
		#msg{color:#070;margin-left:8px}
	</style>
	<script>
	/* файл данных выбирается параметром ?n=  (index.html?n=50 -> data50.html), по умолчанию data1.html*/
	var N = new URLSearchParams(location.search).get('n') || '1';
	var DATA = 'data' + N + '.html';
	/* время от начала загрузки страницы до окончания отображения: performance.now() отсчитывается от начала навигации.*/
	/* rAF + setTimeout(0) -> замер после того, как браузер отрисовал вставленный контент */

	/*серия замеров: список адресов лежит в sessionStorage, после каждого замера переходим к следующему */
	function nextInQueue() {
		try {
			var q = JSON.parse(sessionStorage.getItem('queue') || '[]');
			if (!q.length) return;
			var nx = q.shift(); sessionStorage.setItem('queue', JSON.stringify(q));
			setTimeout(function () { location.href = nx; }, 700);
		} catch (e) {}
	}
	function showTime(label) {
		requestAnimationFrame(function () { setTimeout(function () {
			var t = performance.now();
			document.getElementById('mytime').innerHTML = t.toFixed(1) + ' мс (n=' + N + ')';
			try { var log = JSON.parse(localStorage.getItem('runs') || '[]');
				log.push({variant: label, n: +N, ms: Math.round(t)});
				localStorage.setItem('runs', JSON.stringify(log)); } catch (e) {}
			console.log(label, N, t);
			nextInQueue();
		}, 0); });
	}
	function makeRequest(url) {
		$.ajax({
			type:'GET',
			url:url,
			async:true,
			success: function(data) 
				{ 
					document.getElementById('mycontent').innerHTML=data; // вывод содержимого
					showTime('jQuery'); // вывод времени (после отрисовки)
				}
			});
	}
	</script>
</head>
<body onLoad="makeRequest(DATA)">
	<h1>Время загрузки c jQuery: <span id="mytime">...</span></h1>
	<hr size="1">
	<div id="mycontent"></div>
	<p>Новостей: <a href="index_jquery.html?n=1">1</a> | <a href="index_jquery.html?n=10">10</a> | <a href="index_jquery.html?n=25">25</a> | <a href="index_jquery.html?n=50">50</a> | <a href="index_jquery.html?n=100">100</a> | <a href="index_jquery.html?n=150">150</a> | <a href="index_jquery.html?n=200">200</a></p>
	<p><a href="results.html">таблица и график замеров</a></p>
</body>
</html>
