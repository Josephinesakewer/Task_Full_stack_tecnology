<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конвертер XML → JSON</title>
<link rel="stylesheet" href="style.css">
<script src="XMLtoJSONconverter.js"></script>
</head>
<body>
<main>
  <h1>Конвертер XML → JSON</h1>
  <p class="sub">Вставьте любой корректный XML-документ и нажмите «Конвертировать».</p>

  <div class="grid">
    <div>
      <label for="xml">XML</label>
      <textarea id="xml" spellcheck="false" placeholder="&lt;root&gt;...&lt;/root&gt;"></textarea>
    </div>
    <div>
      <label for="json">JSON</label>
      <textarea id="json" spellcheck="false" readonly placeholder="Здесь появится результат"></textarea>
    </div>
  </div>

  <div class="bar">
    <button class="primary" id="convert" type="button">Конвертировать</button>
    <button id="example" type="button">Пример</button>
    <button id="copy" type="button">Копировать JSON</button>
    <button id="clear" type="button">Очистить</button>
    <div id="status" role="status"></div>
  </div>
</main>
</body>
</html>
